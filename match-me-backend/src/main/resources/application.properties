spring.application.name=match-me
# --- Server Config ---
server.port=8080

# --- PostgreSQL Database Config ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/matchme_db}
# default PostgreSQL port (5432)
# we need to create the database manually

spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:mypassword123}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP Connection Pool ---
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-test-query=SELECT 1

# --- JPA / Hibernate Config ---
spring.jpa.hibernate.ddl-auto=update
# creates tables automatically based on our entity classes

spring.jpa.show-sql=true
# shows sql queries on terminal debugging purposes

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- File Upload Config ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Custom App Properties ---
app.upload.dir=uploads/profile-pictures

# spring.web.cors.allowed-origins=http://localhost:3000

# --- Logging ---
logging.level.org.hibernate.SQL=DEBUG

# --- JWT Config ---
jwt.secret=${JWT_SECRET:aB3dE6fG9hJ2kL5mN8oP1qR4sT7uV0wX3yZ6aC9bD2eF5gH8iJ1kL4mN7oP0qR3sT}
